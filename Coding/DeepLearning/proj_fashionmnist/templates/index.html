<!DOCTYPE html>
<html lang="ko">


<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


    <title>FashionMNIST</title>
</head>


<body>
    <div class="container">
    <h2>FashionMNIST 이미지 분류</h2>
    <input class="btn btn-outline-primary" type="file" id="imageInput" accept="image/*">
    <button class="btn btn-success" onclick="uploadImage()">업로드</button>

    <div id="imageContainer" style="margin-top: 20px;">
        <p>업로드된 이미지: <span class="badge bg-success" id="predClass"></span></p>
        <img id="preview" src="" alt="미리보기" style="max-width: 300px; display: none;">
    </div>



    <script>
        async function uploadImage(){
            const input = document.getElementById('imageInput')
            if (input.files.length == 0 ){
                alert('이미지를 선택해주세요.')
                return;
            }

            //multipart/formdata
            const formData = new FormData();
            formData.append('fashionfile', input.files[0]) // 서버에는 'fashionfile' 로 전달

            const response = await fetch('/upload', {
                method:'POST',
                body : formData
            });

            const result = await response.json();

            if(response.ok){
                // alert('업로드 성공' + result.filename);
                const imgElement = document.getElementById('preview');
                imgElement.src = result.url;
                imgElement.style.display = 'block';
            }else{
                alert('업로드 실패!')
            }
            
            document.getElementById('predClass').innerHTML = result.pred;
        }

    </script>


    </div>
</body>


</html>
