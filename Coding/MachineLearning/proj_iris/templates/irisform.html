<!DOCTYPE html>
<html lang="ko">
<!-- 🚩이 파일은 메인 화면입니다. 절대로 수정하지 마세요 -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.0/jquery.min.js"></script>
    <script src="/static/irisform.js"></script>
    <title>Lang</title>
</head>

<body>
    <div class="container">

        <h1>붓꽃 판별기</h1>

        <div class="alert alert-success" id="result">입력이 없습니다</div>

        <div class="row">
            <div class="col">
                <label for="sepal_length">꽃받침 길이</label>
                <input type="number" class="form-control" id="sepal_length" placeholder="sepal_length"
                    name="sepal_length">
            </div>

            <div class="col">
                <label for="sepal_width">꽃받침 너비</label>
                <input type="number" class="form-control" id="sepal_width" placeholder="sepal_width" name="sepal_width">
            </div>
        </div>

        <div class="row mt-3">
            <div class="col">
                <label for="petal_length">꽃잎 길이</label>
                <input type="number" class="form-control" id="petal_length" placeholder="petal_length"
                    name="petal_length">
            </div>

            <div class="col">
                <label for="petal_width">꽃잎 너비</label>
                <input type="number" class="form-control" id="petal_width" placeholder="petal_width" name="petal_width">
            </div>
        </div>

        <br>
        <button type="button" class="w-100 btn btn-primary btn-lg" id="btn_iris">판정하기</button>
    </div>
</body>

</html>
